# Cihaz üstü eklenti duman testleri (integration_test/).
#
# Her PR'da koşmaz: bir Android emülatörü ayağa kaldırmak ~10 dk sürer ve bu
# testler yalnız NATIVE katman değiştiğinde bilgi taşır — eklenti sürümü,
# minSdk/AGP, ProGuard kuralları, Firebase yapılandırması, DB şema sürümü.
# Böyle bir değişiklik yaptığında Actions sekmesinden elle çalıştır; sürüm
# etiketlerinde otomatik koşar.
name: Integration (device)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          # Surumu sabit tut: `channel: stable` ile CI kendiliginden yeni bir
          # Flutter'a atlar ve formatter ciktisi degisince `dart format
          # --set-exit-if-changed` adimi, kod hic degismeden main'i kirar
          # (2026-08-09'da tam olarak bu oldu). Yukseltirken DORT workflow'u
          # birlikte tasi ve ayni surumu yerelde de kur:
          #   flutter downgrade 3.44.9   /   flutter upgrade
          channel: stable
          flutter-version: 3.44.9
      - run: flutter pub get

      # KVM olmadan emülatör yazılım öykünmesine düşer ve testler zaman aşımına
      # uğrar; runner'da /dev/kvm erişimini açıyoruz.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # Bu testler Firebase/Play Services'e dokunuyor; donanım hızlandırma
          # ve pencere kapalı çalıştırma emülatörü CI'da kararlı tutuyor.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: flutter test integration_test/plugin_smoke_test.dart
